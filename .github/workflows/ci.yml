name: CI

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  test-and-check:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run svelte-check
        run: npm run check

      - name: Run Security Controls Test
        run: node scripts/test-security.mjs

      - name: Verify Production Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://wardrobe:placeholder@localhost:5432/wardrobe
          SESSION_SECRET: test_session_secret_for_ci_build_must_be_over_32_chars
